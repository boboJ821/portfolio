<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIY Image Factory · 模板集合</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111217;
        color: #ececf3;
        font:
          15px/1.7 system-ui,
          sans-serif;
      }
      main {
        max-width: 1280px;
        margin: auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: clamp(24px, 4vw, 40px);
        margin: 8px 0;
      }
      h2 {
        font-size: 22px;
        margin-top: 48px;
      }
      p,
      small {
        color: #aaaaba;
      }
      small {
        display: block;
        margin-top: 8px;
      }
      a {
        color: inherit;
      }
      header {
        max-width: 760px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
        border: 1px solid #30313b;
        border-radius: 12px;
        overflow: hidden;
        background: #1b1c23;
      }
      figure img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: contain;
        background: #24252d;
      }
      figcaption {
        padding: 16px;
        overflow-wrap: anywhere;
      }
      b {
        font-size: 13px;
      }
      .results {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .results img {
        height: auto;
      }
      video {
        width: 100%;
        max-height: 560px;
        background: #000;
      }
      a:focus-visible {
        outline: 3px solid #bd9aff;
        outline-offset: 3px;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
        main {
          padding: 28px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <small>DIY IMAGE FACTORY / MATERIAL COLLECTION</small>
        <h1>从模板底图，到批量成品。</h1>
        <p>
          收录 14 个模板文件，按文件内容去重为 12
          张。保留历史版本，不包含机箱、显卡、风扇、叠加图层和缓存。下方底图不代表生成效果；点击图片可查看原图。
        </p>
      </header>
      <h2>生成效果</h2>
      <p>现有单张成品与批量结果截图。价格与配置仅为项目演示内容。</p>
      <div class="results grid">
        <figure>
          <a href="屏幕截图 2026-09-14 135915.png"
            ><img src="屏幕截图 2026-09-14 135915.png" alt="生成后的单张配置图"
          /></a>
          <figcaption>单张生成效果</figcaption>
        </figure>
        <figure>
          <a href="屏幕截图 2026-09-14 140015.png"
            ><img src="屏幕截图 2026-09-14 140015.png" alt="批量生成文件截图"
          /></a>
          <figcaption>批量结果 · 文件夹截图</figcaption>
        </figure>
      </div>
